name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m compileall -q src tests
      - run: python tests/test_core.py
      - run: python tests/test_verify.py
      - run: python tests/smoke_test.py
  focused-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - name: Replay frozen source offline (identity checked before staging)
        env:
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python src/download.py --replay
          python src/build_dataset.py
          python src/analysis.py
          python src/figures.py
          python src/verify.py --compare-reviewed
          python tests/smoke_test.py
          python tests/check_figure_publish.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  live-refit:
    if: github.event_name == 'workflow_dispatch'
    # Changing official bytes are a manual source check, not the frozen replay gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m pip install uv
      - name: Replay README against reviewed source bytes
        # Static commands only; no event payload is interpolated into shell.
        env:
          MPLBACKEND: Agg
        run: |
          uv venv --python 3.12.10
          source .venv/bin/activate
          uv pip install -r requirements.txt
          python src/download.py
          python -c "import json; from pathlib import Path; expected=json.loads(Path('outputs/source_snapshot.json').read_text())['sha256']; got=json.loads(Path('data/raw/pull_manifest.json').read_text())['sha256']; assert got == expected, f'Official HDB snapshot changed: {got} != {expected}; review and refresh analysis before updating anchors'"
          python src/build_dataset.py
          python src/analysis.py
          python src/figures.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/smoke_test.py
          python src/verify.py
          python tests/check_figure_publish.py
