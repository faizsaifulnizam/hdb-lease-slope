<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc"><title id="title">HDB lease slopes, stratified</title><desc id="desc">Same town, flat type and year. Cross-sectional associations, not individual-flat decay.</desc><rect width="1280" height="320" fill="#FBFBF9"/><path d="M64 64H1216" stroke="#22607B" stroke-width="4"/><text x="64" y="142" font-family="Source Serif 4,Georgia,serif" font-size="48" fill="#14293D">A lease slope is not a decay forecast</text><text x="64" y="193" font-family="Inter,Arial,sans-serif" font-size="23" fill="#5C6B79">Same town. Same flat type. Same year. Different remaining leases.</text><text x="64" y="251" font-family="Inter,Arial,sans-serif" font-size="20" fill="#22607B">HDB LEASE SLOPE · DESCRIPTIVE ONLY</text><text x="1216" y="270" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5C6B79">Singapore public data · 6 of 6</text></svg>